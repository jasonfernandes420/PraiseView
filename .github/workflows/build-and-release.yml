name: Build and Release PraiseView

on:
  push:
    branches:
      - development # Trigger on pushes to the development branch

jobs:
  build:
    runs-on: windows-latest # jpackage for MSI requires a Windows runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # Or 'microsoft', 'zulu', etc.
          cache: 'maven'

      - name: Build with Maven and create fat JAR
        run: mvn clean install assembly:single

      - name: Find the fat JAR
        id: find_jar
        run: |
          $jarPath = Get-ChildItem -Path target -Filter "praiseview-*-jar-with-dependencies.jar" | Select-Object -ExpandProperty FullName
          echo "FAT_JAR_PATH=$jarPath" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create MSI installer with jpackage
        run: |
          $jarName = Split-Path -Path "${{ steps.find_jar.outputs.FAT_JAR_PATH }}" -Leaf
          $version = "${{ github.ref_name }}" -replace "development", "${{ github.sha }}" # Use commit SHA for version if on development branch
          if ($version.Length -gt 7) { $version = $version.Substring(0, 7) } # Shorten SHA for version
          $appVersion = "${{ github.event.repository.name }}-${version}"
          
          jpackage `
            --input target `
            --name "PraiseView" `
            --main-jar "$jarName" `
            --main-class com.praiseview.PraiseViewApp `
            --type msi `
            --dest build/installer `
            --app-version "1.0.${{ github.run_number }}" ` # Use GitHub run number for unique build version
            --vendor "PraiseView Team" `
            --copyright "Copyright 2023 PraiseView Team" `
            --description "PraiseView Application" `
            --win-menu `
            --win-shortcut
        shell: pwsh

      - name: Find generated MSI
        id: find_msi
        run: |
          $msiPath = Get-ChildItem -Path build/installer -Filter "*.msi" | Select-Object -ExpandProperty FullName
          echo "MSI_PATH=$msiPath" >> $env:GITHUB_OUTPUT
          echo "MSI_NAME=$(Split-Path -Path $msiPath -Leaf)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }} # Use GitHub run number as part of the tag
          release_name: PraiseView Build v1.0.${{ github.run_number }}
          body: |
            Automated build of PraiseView.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: true # Mark as prerelease for development builds

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_msi.outputs.MSI_PATH }}
          asset_name: ${{ steps.find_msi.outputs.MSI_NAME }}
          asset_content_type: application/x-msi

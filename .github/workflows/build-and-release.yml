name: Build and Release PraiseView

on:
  push:
    branches:
      - development # Trigger on pushes to the development branch

jobs:
  build:
    runs-on: windows-latest # jpackage for MSI requires a Windows runner
    permissions:
      contents: write # Grant write permission for contents to allow creating releases and uploading assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # Or 'microsoft', 'zulu', etc.
          cache: 'maven'

      - name: Build with Maven and create fat JAR
        run: mvn clean package

      - name: Find shaded JAR
        id: find_jar
        shell: pwsh
        run: |
          $jarPath = Get-ChildItem -Path target -Filter "*-all.jar" |
            Select-Object -First 1 -ExpandProperty FullName

          echo "FAT_JAR_PATH=$jarPath" >> $env:GITHUB_OUTPUT

          Write-Host "Found JAR: $jarPath"

      - name: Create Runtime Image
        shell: pwsh
        run: |
          jlink --add-modules java.base,java.desktop,java.net.http,java.logging,java.naming,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.xml.crypto,jdk.jfr,jdk.unsupported --output runtime

      - name: Create MSI Installer
        shell: pwsh
        run: |

          $jarName = Split-Path `
            -Path "${{ steps.find_jar.outputs.FAT_JAR_PATH }}" `
            -Leaf

          jpackage `
            --type msi `
            --name PraiseView `
            --input target `
            --main-jar $jarName `
            --icon src/main/resources/images/logo-transparent.ico `
            --main-class com.praiseview.Launcher `
            --runtime-image runtime `
            --app-version "1.0.${{ github.run_number }}" `
            --vendor "PraiseView Team" `
            --copyright "Copyright 2025 PraiseView Team" `
            --description "Church projection software" `
            --win-menu `
            --win-shortcut `
            --dest build/installer

      - name: Find generated MSI
        id: find_msi
        run: |
          $msiPath = Get-ChildItem -Path build/installer -Filter "*.msi" | Select-Object -ExpandProperty FullName
          echo "MSI_PATH=$msiPath" >> $env:GITHUB_OUTPUT
          echo "MSI_NAME=$(Split-Path -Path $msiPath -Leaf)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }} # Use GitHub run number as part of the tag
          release_name: PraiseView Build v1.0.${{ github.run_number }}
          body: |
            Automated build of PraiseView.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: true # Mark as prerelease for development builds

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_msi.outputs.MSI_PATH }}
          asset_name: ${{ steps.find_msi.outputs.MSI_NAME }}
          asset_content_type: application/x-msi
